<text x="40" y="52" font-size="22" font-weight="700" fill="#1d1d1f">Every change, every time</text>
<text x="40" y="78" font-size="15" fill="#6b6b70">Agents do the work. The founder holds two gates. Nothing ships around them.</text>
<rect x="40.0" y="115" width="150" height="74" rx="10" fill="#ffffff" stroke="#c9c9cf" stroke-width="1.2"/>
<text x="54.0" y="145" font-size="16" font-weight="650" fill="#1d1d1f">1  Ticket</text>
<text x="54.0" y="168" font-size="13" fill="#6b6b70">one problem</text>
<line x1="194.0" y1="152.0" x2="230.0" y2="152.0" stroke="#6b6b70" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="234.0" y="115" width="150" height="74" rx="10" fill="#ffffff" stroke="#c9c9cf" stroke-width="1.2"/>
<text x="248.0" y="145" font-size="16" font-weight="650" fill="#1d1d1f">2  Measure</text>
<text x="248.0" y="168" font-size="13" fill="#6b6b70">code + data first</text>
<line x1="388.0" y1="152.0" x2="424.0" y2="152.0" stroke="#6b6b70" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="428.0" y="115" width="150" height="74" rx="10" fill="#ffffff" stroke="#c9c9cf" stroke-width="1.2"/>
