<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="1280" height="640" rx="24" fill="#0D0E11"/>
<circle cx="905" cy="322" r="172" fill="none" stroke="#2A2C33" stroke-width="2"/>
<text x="72" y="96" font-size="18" fill="#8B8D94" letter-spacing="0.5">founder-agent-workflow</text>
<text x="72" y="178" font-size="54" font-weight="700" fill="#F2F1EE" letter-spacing="-1.5">Agents build.</text>
<text x="72" y="242" font-size="54" font-weight="700" fill="#FF6B3D" letter-spacing="-1.5">You ship.</text>
<text x="72" y="300" font-size="21" fill="#8B8D94">Every change runs the same loop.</text>
<text x="72" y="330" font-size="21" fill="#8B8D94">Two gates are yours. Nothing ships around them.</text>
<text x="72" y="520" font-size="15" font-weight="600" fill="#F2F1EE">Fast path</text>
<text x="72" y="545" font-size="15" fill="#8B8D94">Copy, styling, docs skip measure and plan.</text>
<text x="72" y="568" font-size="15" fill="#8B8D94">Never the YES.</text>
<text x="420" y="520" font-size="15" font-weight="600" fill="#F2F1EE">Verify fails?</text>
<text x="420" y="545" font-size="15" fill="#8B8D94">Roll back first,</text>
<text x="420" y="568" font-size="15" fill="#8B8D94">report second.</text>
<text x="905" y="316" text-anchor="middle" font-size="15" fill="#8B8D94" letter-spacing="2">EVERY CHANGE</text>
<text x="905" y="340" text-anchor="middle" font-size="15" fill="#8B8D94" letter-spacing="2">EVERY TIME</text>
<circle r="5" fill="#FF6B3D"><animateMotion dur="9s" repeatCount="indefinite" path="M 905 150 A 172 172 0 1 1 904.99 150"/></circle>
<circle cx="905.0" cy="150.0" r="6" fill="#0D0E11" stroke="#F2F1EE" stroke-width="2"/>
<text x="905.0" y="104.0" text-anchor="middle" font-size="17" font-weight="600" fill="#F2F1EE"><tspan fill="#8B8D94">1  </tspan>Ticket</text>
<text x="905.0" y="123.0" text-anchor="middle" font-size="13" fill="#8B8D94">one problem</text>
<circle cx="998.0" cy="177.3" r="6" fill="#0D0E11" stroke="#F2F1EE" stroke-width="2"/>
<text x="1014.2" y="150.1" text-anchor="start" font-size="17" font-weight="600" fill="#F2F1EE"><tspan fill="#8B8D94">2  </tspan>Measure</text>
<text x="1014.2" y="169.1" text-anchor="start" font-size="13" fill="#8B8D94">code and data first</text>
<circle cx="1061.5" cy="250.5" r="6" fill="#0D0E11" stroke="#F2F1EE" stroke-width="2"/>
<text x="1088.7" y="236.1" text-anchor="start" font-size="17" font-weight="600" fill="#F2F1EE"><tspan fill="#8B8D94">3  </tspan>Plan</text>
<text x="1088.7" y="255.1" text-anchor="start" font-size="13" fill="#8B8D94">then hold</text>
<circle cx="1075.2" cy="346.5" r="13" fill="#0D0E11" stroke="#FF6B3D" stroke-width="2.5"/>
<circle cx="1075.2" cy="346.5" r="5" fill="#FF6B3D"/>
<text x="1104.9" y="348.7" text-anchor="start" font-size="20" font-weight="700" fill="#FF6B3D">GO</text>
<text x="1104.9" y="368.7" text-anchor="start" font-size="13" fill="#FF6B3D" opacity="0.8">your product call</text>
<circle cx="1035.0" cy="434.6" r="6" fill="#0D0E11" stroke="#F2F1EE" stroke-width="2"/>
<text x="1057.7" y="452.3" text-anchor="start" font-size="17" font-weight="600" fill="#F2F1EE"><tspan fill="#8B8D94">4  </tspan>Build</text>
<text x="1057.7" y="471.3" text-anchor="start" font-size="13" fill="#8B8D94">own branch</text>
<circle cx="953.5" cy="487.0" r="6" fill="#0D0E11" stroke="#F2F1EE" stroke-width="2"/>
<text x="961.9" y="513.8" text-anchor="start" font-size="17" font-weight="600" fill="#F2F1EE"><tspan fill="#8B8D94">5  </tspan>Check</text>
<text x="961.9" y="532.8" text-anchor="start" font-size="13" fill="#8B8D94">tests, click-through</text>
<circle cx="856.5" cy="487.0" r="6" fill="#0D0E11" stroke="#F2F1EE" stroke-width="2"/>
<text x="848.1" y="513.8" text-anchor="end" font-size="17" font-weight="600" fill="#F2F1EE"><tspan fill="#8B8D94">6  </tspan>User impact</text>
<text x="848.1" y="532.8" text-anchor="end" font-size="13" fill="#8B8D94">customers will see</text>
<circle cx="775.0" cy="434.6" r="13" fill="#0D0E11" stroke="#FF6B3D" stroke-width="2.5"/>
<circle cx="775.0" cy="434.6" r="5" fill="#FF6B3D"/>
<text x="752.3" y="452.3" text-anchor="end" font-size="20" font-weight="700" fill="#FF6B3D">YES</text>
<text x="752.3" y="472.3" text-anchor="end" font-size="13" fill="#FF6B3D" opacity="0.8">your typed release</text>
<circle cx="734.8" cy="346.5" r="6" fill="#0D0E11" stroke="#F2F1EE" stroke-width="2"/>
<text x="705.1" y="348.7" text-anchor="end" font-size="17" font-weight="600" fill="#F2F1EE"><tspan fill="#8B8D94">7  </tspan>Release</text>
<text x="705.1" y="367.7" text-anchor="end" font-size="13" fill="#8B8D94">rollback taken</text>
<circle cx="748.5" cy="250.5" r="6" fill="#0D0E11" stroke="#F2F1EE" stroke-width="2"/>
<text x="721.3" y="236.1" text-anchor="end" font-size="17" font-weight="600" fill="#F2F1EE"><tspan fill="#8B8D94">8  </tspan>Verify</text>
<text x="721.3" y="255.1" text-anchor="end" font-size="13" fill="#8B8D94">by outcome</text>
<circle cx="812.0" cy="177.3" r="6" fill="#0D0E11" stroke="#F2F1EE" stroke-width="2"/>
<text x="795.8" y="150.1" text-anchor="end" font-size="17" font-weight="600" fill="#F2F1EE"><tspan fill="#8B8D94">9  </tspan>Record</text>
<text x="795.8" y="169.1" text-anchor="end" font-size="13" fill="#8B8D94">ticket closed</text>
</svg>
